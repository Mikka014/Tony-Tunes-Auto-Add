name: Sync Discord songs to Spotify

on:
  schedule:
    # Every 15 minutes. If your repo is private, use "*/30 * * * *" to stay inside the
    # free 2,000 minutes/month. Public repos have unlimited free minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log what would happen, change nothing)"
        type: boolean
        default: false
      backfill_since:
        description: "One-time catch-up: scan the whole channel back to this date, e.g. 2026-01-01 (leave blank for a normal run)"
        type: string
        default: ""

concurrency:
  group: discord-spotify-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # normal runs finish in about a minute; a long backfill needs room
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          BACKFILL_SINCE: ${{ inputs.backfill_since }}
